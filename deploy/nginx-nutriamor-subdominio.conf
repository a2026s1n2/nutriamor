# Nginx — subdomínio NutriAmor (ex.: nutriamor.cienciadedadosunivesp.app.br)
# Salvar em: /etc/nginx/sites-available/nutriamor
# Ativar:    sudo ln -s /etc/nginx/sites-available/nutriamor /etc/nginx/sites-enabled/
# Testar:    sudo nginx -t && sudo systemctl reload nginx
#
# Pré-requisito: Docker com a app em 127.0.0.1:8000 (docker compose --profile full up -d)

server {
    listen 80;
    listen [::]:80;
    server_name nutriamor.cienciadedadosunivesp.app.br;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# Depois de validar o DNS, obtenha certificado Let's Encrypt:
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d nutriamor.cienciadedadosunivesp.app.br
# O certbot altera este arquivo para escutar também em 443 com SSL.
